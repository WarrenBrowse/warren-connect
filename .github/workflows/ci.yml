name: CI

# Runs on GitHub-hosted runners: free and unlimited for a public repo, and
# faster than the self-hosted pools were.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt + clippy + test
    # Same-repo PRs and pushes only, a guard kept from the self-hosted era.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # The integration tests replay the shared golden vectors (the public
      # warren-vectors submodule at vectors/), so the checkout brings it in.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The WarrenBrowse git dependencies are public today. The ENGINE_TOKEN
      # secret is an enrichment, never a precondition: when it is unset the step
      # warns and cargo fetches them anonymously. Failing hard on a missing
      # secret would redden runs that could have completed.
      - name: authenticate the private git dependency (best effort)
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          if [ -z "${ENGINE_TOKEN:-}" ]; then
            echo "::warning::ENGINE_TOKEN is unset; fetching the git dependencies anonymously"
            exit 0
          fi
          # Ephemeral XDG_CONFIG_HOME so the token never lands in the user's
          # git config.
          mkdir -p "$RUNNER_TEMP/gitconfig/git"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig/git/config" \
            "url.https://x-access-token:${ENGINE_TOKEN}@github.com/WarrenBrowse/.insteadOf" \
            "https://github.com/WarrenBrowse/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Three #[sqlx::test] tests need a real Postgres (DATABASE_URL). Run a
      # throwaway user-owned cluster from the postgresql binaries the runner
      # image ships, exactly as warren-core's CI does. Keeping the two
      # identical means a runner-image drift is diagnosed once, not twice.
      - name: Start PostgreSQL for the #[sqlx::test] tests
        run: |
          # Auto-detect the installed PostgreSQL bin dir instead of hardcoding a
          # major version: the runner image's PG version drifts, and a hardcoded
          # path that vanishes turns `initdb` into exit-127, reddening this gate
          # on EVERY push, which is how a real regression hides behind a
          # permanently-red CI everyone learned to ignore.
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$PG_BIN" ]; then
            echo "postgres not found on runner; installing via apt"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
            PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$PG_BIN" ]; then
            echo "::error::no PostgreSQL server binaries under /usr/lib/postgresql/*/bin and apt install failed on this runner"
            exit 1
          fi
          echo "using PostgreSQL at $PG_BIN"
          export PATH="$PG_BIN:$PATH"
          pkill -u "$(id -u)" -x postgres 2>/dev/null || true
          PGDATA="$RUNNER_TEMP/pgdata"
          rm -rf "$PGDATA"
          initdb -D "$PGDATA" -U postgres --auth-local=trust --auth-host=trust >/dev/null
          # -k /tmp: the default unix-socket dir is not writable by the
          # unprivileged runner user. Tests connect over TCP (localhost:5432).
          pg_ctl -D "$PGDATA" -o "-p 5432 -k /tmp" -l "$RUNNER_TEMP/pg.log" -w start
          echo "DATABASE_URL=postgres://postgres@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: cargo test
        run: cargo test --workspace --all-targets

      # This service holds the DiscourseConnect secret, the forum handle HMAC
      # key and a Discourse admin API key, so a known-vulnerable dependency is
      # a real finding here rather than hygiene.
      # cargo-deny's own git fetch of the advisory database failed on every
      # run of 2026-09-02 (a cached clone that could not fast-forward, then a
      # fresh clone that could not clone at all), with no code change between
      # runs. The checkout action fetches through the token-backed path that
      # every other step of this workflow already relies on, into the exact
      # directory cargo-deny derives for the default database URL, and the
      # check then runs without touching the network.
      #
      # `persist-credentials: false` keeps this job's token out of the clone's
      # `.git/config` once it is copied into `~/.cargo/advisory-dbs`: on a
      # persistent runner that copy outlives the token, and cargo-deny's next
      # fetch there died on a 401 (warren-core, 2026-09-07).
      - name: Fetch the RustSec advisory database
        uses: actions/checkout@v5
        with:
          repository: RustSec/advisory-db
          ref: main
          path: advisory-db
          fetch-depth: 1
          persist-credentials: false
      # Pinned: `--disable-fetch` needs 0.19 (an older binary answered
      # "unexpected argument" on 2026-09-02).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      - name: cargo deny (advisories, bans, licenses, sources)
        run: |
          set -euo pipefail
          cargo deny --version
          rm -rf ~/.cargo/advisory-dbs
          mkdir -p ~/.cargo/advisory-dbs
          cp -R advisory-db ~/.cargo/advisory-dbs/advisory-db-3157b0e258782691
          cargo deny check --disable-fetch advisories bans licenses sources
